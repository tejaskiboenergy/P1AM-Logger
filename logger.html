<!DOCTYPE html>
<html>
<head>
  <title>P1AM Logger</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    button { margin: 5px; padding: 8px 16px; font-size: 14px; }
    #log { background: #111; color: #0f0; padding: 10px; 
           height: 300px; overflow-y: auto; margin-top: 10px; }
    #status { color: blue; margin: 8px 0; font-size: 14px; }
  </style>
</head>
<body>
  <h2>P1AM Thermocouple Logger</h2>
  <button onclick="connect()">Connect Serial</button>
  <button onclick="startLogging()" id="btnLog" disabled>Start Logging to Sheets</button>
  <button onclick="stopLogging()" id="btnStop" disabled>Stop</button>
  <div id="status">Not connected</div>
  <div id="log"></div>

  <script>https://script.google.com/macros/s/AKfycbz0XMEhyOY71YIO6S6IXmq6mcCwKMVrBKB5BHtpIgoZ90omhrERYIc4ITp0m-nBIlKT/exechttps://script.google.com/macros/s/AKfycbzXiWKzUbfybDDdKK6PcekvxsxuOqX9CiVIlxYtSiLxbj2zKdXSY0tB_wurZPbbk83U/exec";

    let port, logging = false;

    async function connect() {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 115200 });
      document.getElementById("status").textContent = "Connected!";
      document.getElementById("btnLog").disabled = false;
      readLoop();
    }

    async function readLoop() {
      const decoder = new TextDecoderStream();
      port.readable.pipeTo(decoder.writable);
      const reader = decoder.readable.getReader();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let lines = buffer.split("\n");
        buffer = lines.pop();
        for (const line of lines) {
          const trimmed = line.trim();
          if (trimmed && trimmed !== "Ready") handleLine(trimmed);
        }
      }
    }

    function handleLine(line) {
      const parts = line.split(",");
      if (parts.length !== 5) return;
      const [elapsed, c1, c2, c3, c4] = parts;
      const now = new Date().toISOString();

      const logDiv = document.getElementById("log");
      logDiv.innerHTML += `${now} | t=${elapsed}s | CH1:${c1}°C CH2:${c2}°C CH3:${c3}°C CH4:${c4}°C<br>`;
      logDiv.scrollTop = logDiv.scrollHeight;

      if (logging) sendToSheets(now, elapsed, c1, c2, c3, c4);
    }

    function sendToSheets(datetime, elapsed, c1, c2, c3, c4) { const url = SCRIPT_URL + "?datetime=" + encodeURIComponent(datetime) + "&elapsed_s=" + encodeURIComponent(elapsed) + "&ch1=" + encodeURIComponent(c1) + "&ch2=" + encodeURIComponent(c2) + "&ch3=" + encodeURIComponent(c3) + "&ch4=" + encodeURIComponent(c4); fetch(url, { mode: "no-cors" }); document.getElementById("status").textContent = "Last sent: " + datetime; }

    function startLogging() {
      logging = true;
      document.getElementById("btnLog").disabled = true;
      document.getElementById("btnStop").disabled = false;
      document.getElementById("status").textContent = "Logging to Google Sheets...";
    }

    function stopLogging() {
      logging = false;
      document.getElementById("btnLog").disabled = false;
      document.getElementById("btnStop").disabled = true;
      document.getElementById("status").textContent = "Connected (not logging)";
    }
  </script>
</body>
</html>
